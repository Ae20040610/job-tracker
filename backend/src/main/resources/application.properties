server.port=8080

# --- MySQL (change username/password to match your machine) ---
spring.datasource.url=jdbc:mysql://localhost:3306/job_tracker?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
